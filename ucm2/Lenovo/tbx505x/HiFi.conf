# Use case configuration for Lenovo Tab M10 HD (TB-X505X)
# PM8953 internal codec HPHL/HPHR feed the dual external speaker amplifiers
# (AW8738 on GPIO 48 and GPIO 19) as well as the 3.5mm headphone jack.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speakers"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='RX1 Digital Volume' 84"
		cset "name='RX2 Digital Volume' 84"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
		cset "name='RX1 Mute Switch' 0"
		cset "name='RX2 Mute Switch' 0"
		cset "name='Speakers Switch' 1"
	]

	DisableSequence [
		cset "name='Speakers Switch' 0"
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
		cset "name='RX1 MIX1 INP1' ZERO"
		cset "name='RX2 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='RX1 Digital Volume' 84"
		cset "name='RX2 Digital Volume' 84"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
		cset "name='RX1 Mute Switch' 0"
		cset "name='RX2 Mute Switch' 0"
	]

	DisableSequence [
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
		cset "name='RX1 MIX1 INP1' ZERO"
		cset "name='RX2 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Primary Microphone"

	EnableSequence [
		cset "name='DEC1 MUX' ADC1"
		cset "name='CIC1 MUX' AMIC"
	]

	DisableSequence [
		cset "name='DEC1 MUX' ZERO"
	]

	Value {
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CapturePriority 200
	}
}
